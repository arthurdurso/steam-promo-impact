[project]
name = "steam-promo-impact"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erros de estilo)
    "W",    # pycodestyle (avisos de estilo)
    "F",    # Pyflakes (imports/variáveis não usados, nomes indefinidos)
    "I",    # isort (ordem dos imports)
    "B",    # flake8-bugbear (padrões que costumam virar bug)
    "UP",   # pyupgrade (sintaxe moderna do Python)
    "SIM",  # flake8-simplify (código que pode ser simplificado)
]
